name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Instalar ferramentas (rojo, selene, stylua)
        run: rokit install --no-trust-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Formatação (StyLua)
        run: stylua --check src

      - name: Lint (Selene)
        run: selene src

      - name: Build do place (Rojo)
        run: rojo build default.project.json -o AnomalyMart.rbxl
